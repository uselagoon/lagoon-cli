name: goreleaser action

on:
  push:
    tags:
      - 'v*'

jobs:
  test-suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goversion:
        - 1.24
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: "0"
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{matrix.goversion}}
    - name: Build
      run: |
        go install go.uber.org/mock/mockgen@v0.4.0
        ARTIFACT_DESTINATION=./builds make build
    # - name: Check version
    #   run: |
    #     ./builds/lagoon --version

  goreleaser:
    needs: test-suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goversion:
        - 1.24
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: "0"
      -
        name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{matrix.goversion}}
      -
        name: Fetch Dependencies
        run: go mod download
      -
        name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.HOMEBREW_REPO_WRITER_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_REPO_WRITER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            lagoon-cli
            homebrew-lagoon-cli
      -
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2
          args: release --verbose --skip=validate
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GOVERSION: ${{ matrix.goversion }}
          LOCAL_ORG: ${{ github.repository_owner }}
